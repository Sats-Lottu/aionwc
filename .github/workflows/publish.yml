name: Build and publish to PyPI

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open('pyproject.toml', 'rb') as project_file:
              version = tomllib.load(project_file)['project']['version']

          expected_tag = f'v{version}'
          release_tag = os.environ['GITHUB_REF_NAME']
          if release_tag != expected_tag:
              raise SystemExit(f'Expected release tag {expected_tag!r}, got {release_tag!r}')
          PY

      - name: Install Poetry
        run: python -m pip install 'poetry==2.4.1'

      - name: Validate project and run tests
        run: |
          poetry check --lock --strict
          poetry install --only main,dev --extras "nip04-fallback fastapi"
          poetry run pytest --cov=aionwc --cov-report=term-missing --cov-fail-under=100

      - name: Build and check distributions
        run: |
          poetry build
          poetry run twine check --strict dist/*

      - name: Upload release distributions
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install 'poetry==2.4.1'

      - name: Install integration dependencies
        run: poetry install --only main,dev,integration --extras "nip04-fallback fastapi"

      - name: Test LNbits and HTTP payments in Docker
        run: poetry run pytest -m integration -q --tb=short

  publish:
    if: github.event_name == 'release' && github.event.action == 'published' && github.repository == 'Sats-Lottu/aionwc' && github.ref_type == 'tag'
    needs: [build, integration]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/aionwc/
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
